apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/advision: "1"
  labels:
    app: adv
  name: adv
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adv
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:        
        app: adv        
    spec:
      containers:
      - image: ezdehar/book-info-adv-v1:0.0.1-SNAPSHOT
        imagePullPolicy: IfNotPresent
        name: adv-1  
        resources:
          requests:
            cpu: "70m"
            memory: "512Mi"
          limits:
            cpu: "100m"
            memory: "768Mi"       
---
apiVersion: v1
kind: Service
metadata:
  labels:
    job: adv  
    app: adv
  name: adv
  annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8700" 
        prometheus.io/path: "/actuator/prometheus"
  namespace: default
spec:
  ports:
  - port: 8700
    name: metrics
    protocol: TCP
    targetPort: 8700
  selector:
    app: adv
  sessionAffinity: None
  type: ClusterIP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ad-sm
  labels:
    release: prometheus-operator
    app: prometheus-operator
spec:
  jobLabel: job
  selector:
    matchLabels:
      app: adv
  endpoints:
  - port: metrics
    path: /actuator/prometheus
    interval: 30s
