apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  labels:
    app: agg
  name: agg
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agg
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:        
        app: agg        
    spec:
      containers: 
      - image: ezdehar/book-info-agg-v4:0.0.2-SNAPSHOT
        imagePullPolicy: IfNotPresent
        name: agg-1
        env:
          - name: GB_LQ_SERVICE_HOST
            value: http://gb
          - name: GB_LQ_SERVICE_PORT
            value: "8001"
          - name: INV1_SERVICE_HOST
            value: http://inven
          - name: INV1_SERVICE_PORT
            value: "8101"
          - name: recommeder_SERVICE_HOST
            value: http://recom
          - name: recommeder_SERVICE_PORT
            value: "8801" 
          - name: review_SERVICE_HOST
            value: http://rev  
          - name: review_SERVICE_PORT
            value: "8600"
          - name: Adv_SERVICE_HOST
            value: http://adv 
          - name: Adv_SERVICE_PORT
            value: "8700"    
          - name: revfActive
            value: "1"
          - name: GBLfActive
            value: "false" 
          - name: advActive.optional
            value: "true"   
          - name: recomfActive
            value: "true"
                
        resources:
            requests:
              cpu: 200m
              #memory: 64Mi  {"0":["GB","GB1","Adv","Agg","Rev1","Inven1","Inven","BookInfo","Recom","Recom1","Rev"],
            limits:
              cpu: 800m
              #memory: 128Mi      
        #readinessProbe:
          #httpGet:
            #port: 8080
            #path: /actuator/health/readiness
          #initialDelaySeconds: 10   # Wait 2.5 minutes before starting readiness checks
          #periodSeconds: 30          # Check every 30 seconds
          #timeoutSeconds: 20         # Timeout after 10 seconds if no response
          #successThreshold: 1
          #failureThreshold: 5   
        #livenessProbe:
          #httpGet:
            #port: 8080
            #path: /actuator/health/liveness  
          #initialDelaySeconds: 10   # Wait 3 minutes before starting liveness checks
          #periodSeconds: 30          # Check every minute
          #timeoutSeconds: 20         # Timeout after 10 seconds if no response
          #failureThreshold: 5        # Allow up to 5 failed checks bef      
      restartPolicy: Always
          
                     
---
apiVersion: v1
kind: Service
metadata:
  labels:
    job: agg  
    app: agg
  name: agg
  annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080" 
        prometheus.io/path: "/actuator/prometheus"
  namespace: default
spec:
  ports:
  - port: 8080
    name: metrics
    protocol: TCP
    targetPort: 8080
  selector:
    app: agg
  sessionAffinity: None
  type: LoadBalancer

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agg-sm
  labels:
    release: prometheus-operator
    app: prometheus-operator
spec:
  jobLabel: job
  selector:
    matchLabels:
      app: agg
  endpoints:
  - port: metrics
    path: /actuator/prometheus
    interval: 30s
