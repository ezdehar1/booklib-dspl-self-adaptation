apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  labels:
    app: gb2
  name: gb2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gb2
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:        
        app: gb2        
    spec:
      containers:
      - image: docker.io/ezdehar/book-info-gb-lq:0.0.2-SNAPSHOT
        imagePullPolicy: IfNotPresent
        name: gb2-1  
        resources:
          requests:
            cpu: "450m"
            memory: "2048Mi"
          limits:
            cpu: "800m"
            memory: "2300Mi"       
---
apiVersion: v1
kind: Service
metadata:
  labels:
    job: gb2  
    app: gb2
  name: gb2
  annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000" 
        prometheus.io/path: "/actuator/prometheus"
  namespace: default
spec:
  ports:
  - port: 8000
    name: metrics
    protocol: TCP
    targetPort: 8000
  selector:
    app: gb2
  sessionAffinity: None
  type: ClusterIP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gb2-sm
  labels:
    release: prometheus-operator
    app: prometheus-operator
spec:
  jobLabel: job
  selector:
    matchLabels:
      app: gb2
  endpoints:
  - port: metrics
    path: /actuator/prometheus
    interval: 30s
