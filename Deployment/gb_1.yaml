apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  labels:
    app: gb
  name: gb
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gb
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:        
        app: gb        
    spec:
      containers:
      - image: docker.io/ezdehar/book-info-gb-hq:0.0.2-SNAPSHOT
        imagePullPolicy: IfNotPresent
        name: gb-1
        resources:
          requests:
            cpu: "450m"
            memory: "2048Mi"
          limits:
            cpu: "800m"
            memory: "2300Mi"
---
apiVersion: v1
kind: Service
metadata:
  labels:
    job: gb  
    app: gb
  name: gb
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8001" 
    prometheus.io/path: "/actuator/prometheus"
  namespace: default
spec:
  ports:
  - port: 8001
    name: metrics
    protocol: TCP
    targetPort: 8001
  selector:
    app: gb
  sessionAffinity: None
  type: ClusterIP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gb-sm
  labels:
    release: prometheus-operator
    app: prometheus-operator
spec:
  jobLabel: job
  selector:
    matchLabels:
      app: gb
  endpoints:
  - port: metrics
    path: /actuator/prometheus
    interval: 30s
