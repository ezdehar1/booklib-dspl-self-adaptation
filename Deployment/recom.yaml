apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  labels:
    app: recom
  name: recom
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recom
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:        
        app: recom        
    spec:
      containers:
      - image: ezdehar/book-info-recom-hq:0.0.2-SNAPSHOT
        imagePullPolicy: IfNotPresent
        name: recom-1   
        resources:
          requests:
            cpu: "60m"
            memory: "768Mi"
          limits:
            cpu: "100m"
            memory: "1024Mi"      
---
apiVersion: v1
kind: Service
metadata:
  labels:
    job: recom  
    app: recom
  name: recom
  annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8801" 
        prometheus.io/path: "/actuator/prometheus"
  namespace: default
spec:
  ports:
  - port: 8801
    name: metrics
    protocol: TCP
    targetPort: 8801
  selector:
    app: recom
  sessionAffinity: None
  type: ClusterIP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: recom-sm
  labels:
    release: prometheus-operator
    app: prometheus-operator
spec:
  jobLabel: job
  selector:
    matchLabels:
      app: recom
  endpoints:
  - port: metrics
    path: /actuator/prometheus
    interval: 30s
