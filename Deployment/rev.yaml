apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  labels:
    app: rev
  name: rev
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rev
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:        
        app: rev        
    spec:
      containers:
      - image: ezdehar/book-info-rev3-v1:0.0.1-SNAPSHOT
        imagePullPolicy: IfNotPresent
        name: rev-1  
        resources:
          requests:
            cpu: "60m"
            memory: "768Mi"
          limits:
            cpu: "100m"
            memory: "1024Mi"       
---
apiVersion: v1
kind: Service
metadata:
  labels:
    job: rev  
    app: rev
  name: rev
  annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8600" 
        prometheus.io/path: "/actuator/prometheus"
  namespace: default
spec:
  ports:
  - port: 8600
    name: metrics
    protocol: TCP
    targetPort: 8600
  selector:
    app: rev
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rev-sm
  labels:
    release: prometheus-operator
    app: prometheus-operator
spec:
  jobLabel: job
  selector:
    matchLabels:
      app: rev
  endpoints:
  - port: metrics
    path: /actuator/prometheus
    interval: 30s
