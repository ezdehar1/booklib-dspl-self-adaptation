apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  labels:
    app: rev2
  name: rev2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rev2
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:        
        app: rev2        
    spec:
      containers:
      - image: ezdehar/book-info-rev-v1:0.0.1-SNAPSHOT
        imagePullPolicy: IfNotPresent
        name: rev2-1      
        resources:
          requests:
            cpu: "60m"
            memory: "768Mi"
          limits:
            cpu: "100m"
            memory: "1024Mi"   
---
apiVersion: v1
kind: Service
metadata:
  labels:
    job: rev2  
    app: rev2
  name: rev2
  annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8601" 
        prometheus.io/path: "/actuator/prometheus"
  namespace: default
spec:
  ports:
  - port: 8601
    name: metrics
    protocol: TCP
    targetPort: 8601
  selector:
    app: rev2
  sessionAffinity: None
  type: ClusterIP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rev2-sm
  labels:
    release: prometheus-operator
    app: prometheus-operator
spec:
  jobLabel: job
  selector:
    matchLabels:
      app: rev2
  endpoints:
  - port: metrics
    path: /actuator/prometheus
    interval: 30s
